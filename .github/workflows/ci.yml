name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter — that would restrict runs to PRs targeting main, so in
  # a stack only the bottom PR gets checked and every one above it merges on
  # faith. Any open PR should be gated, whatever it targets.
  pull_request:

# Supersede in-flight runs for the same ref so rapid pushes don't queue behind
# results nobody will read. `main` is excluded — those runs gate the deployable
# history and must each complete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The repo is public, so without this GITHUB_TOKEN gets the repo/org default. No job
# writes to the repository: artifacts use the runner's own token and SonarCloud
# decorates PRs through its GitHub App.
permissions:
  contents: read

# Every `uses:` is pinned to a full commit SHA (a moved tag would otherwise run new code
# in CI unreviewed); Dependabot keeps them current. That includes the composite action
# in .github/actions/setup.
#
# Job names are required status check contexts on `main` — see CLAUDE.md before renaming.
# Lint, Typecheck, Unit Tests and E2E Tests run in parallel: none consumes another's
# output, and serialising them only added their durations together.
jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run format:check
      - run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Builds every project in tsconfig.json's `references`: app, node configs,
      # unit tests, and e2e. Vitest does not typecheck, and the E2E webServer runs
      # `vite build` alone, so this job is the only typecheck gate.
      - run: bun run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The same suite as `bun run test`, plus the lcov report the SonarQube job scans.
      # Running it once here instead of again in that job keeps a single source of truth
      # for pass/fail and halves the test minutes.
      - run: bun run test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 1

  # SonarCloud analysis. Runs from CI rather than as SonarCloud's "Automatic Analysis" so
  # the vitest coverage report is included — Automatic Analysis inspects the repository
  # directly and never sees CI output. The two modes are mutually exclusive: Automatic
  # Analysis must be OFF in the SonarCloud project settings, or this scan fails.
  #
  # Deliberately NOT a required status check (see CLAUDE.md): fork and Dependabot PRs get
  # no secrets, and an outage at an external service shouldn't block merges.
  sonarqube:
    name: SonarQube
    needs: unit-tests
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Sonar attributes issues and decides what is new code from history; a shallow
          # clone makes every line look new.
          fetch-depth: 0
          persist-credentials: false
      # lcov paths are relative to the repository root (SF:src/...), which is where the
      # scanner runs, so the report from Unit Tests resolves against this checkout.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage
          path: coverage
      - name: Skip without a token
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN is not available to this run (fork or Dependabot PR); skipping the scan."
      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_HOST_URL: https://sonarcloud.io

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run in the official Playwright image: browsers + system deps are baked in, so
    # there's no runtime `playwright install` (its browser download reliably hung on
    # hosted runners). The image tag MUST match the exact @playwright/test version in
    # package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # The Playwright image lacks `unzip`, which setup-bun needs to extract the Bun
      # archive. Skipped if a future image ships it.
      - run: command -v unzip || (apt-get update && apt-get install -y --no-install-recommends unzip)
      - uses: ./.github/actions/setup
      - run: bun run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Builds every story, catching indexer and runtime failures that `tsc -b` can't:
  # .storybook/main.ts notes that indexing breaks on some CSF syntax, and
  # storybook-solidjs-vite declares exact vite 7 peers while the repo is on vite 8.
  #
  # Deliberately NOT a required status check, so a Storybook-only breakage is visible
  # without blocking merges. Making it required means updating the protection contexts
  # as CLAUDE.md describes.
  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run build-storybook --quiet
