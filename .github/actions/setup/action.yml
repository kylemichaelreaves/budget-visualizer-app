name: Set up Bun, Node and dependencies
description: >-
  Installs the Bun version pinned by package.json's `packageManager`, the Node version in
  .nvmrc, restores Bun's install cache keyed on bun.lock, and runs a frozen install.
  Expects the repository to be checked out already.

runs:
  using: composite
  steps:
    # Reads `packageManager` from package.json. Without a pin CI gets whatever Bun is latest,
    # and a lockfile-format change in a new release breaks `--frozen-lockfile` on every PR.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version-file: .nvmrc
    # Bun's global package cache, not node_modules: install still links node_modules from
    # it, so a stale cache can only cost a download, never a wrong tree.
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-
    - run: bun install --frozen-lockfile
      shell: bash
