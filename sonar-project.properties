# ==============================================================================
# SonarQube / SonarCloud configuration
# ==============================================================================
# Analysis runs from CI (see the `sonarqube` job in .github/workflows/ci.yml), NOT via
# SonarCloud's Automatic Analysis. Automatic Analysis inspects the repository directly and
# never sees CI artifacts, so it can never report coverage. The two modes are mutually
# exclusive: Automatic Analysis must be OFF in the SonarCloud project settings.
#
# NOTE: this project did not exist in SonarCloud — the repository was not being analysed at
# all. The project must be created and bound to this repository before the first scan.

sonar.projectKey=kylemichaelreaves_budget-visualizer-app
sonar.organization=kylemichaelreaves
sonar.projectName=budget-visualizer-app

# ==============================================================================
# Sources and tests
# ==============================================================================
sonar.sources=src
sonar.tests=tests

sonar.exclusions=\
  **/node_modules/**,\
  **/coverage/**,\
  **/dist/**,\
  **/playwright-report/**,\
  **/test-results/**,\
  **/*.d.ts

# ==============================================================================
# Coverage
# ==============================================================================
# Emitted by `bun run test:coverage`; the lcov reporter is configured explicitly in
# vitest.config.ts because vitest's defaults do not include it.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.coverage.exclusions=\
  tests/**,\
  src/main.ts,\
  **/*.d.ts

sonar.sourceEncoding=UTF-8
